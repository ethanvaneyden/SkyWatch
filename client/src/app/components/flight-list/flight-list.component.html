<div class="flight-list-container">
  <h3>{{ user()?.user_type === 'ATC' ? 'All Flights' : 'My Booked Flights' }}</h3>
  
  <div *ngIf="loading()" class="loading">Loading flights...</div>
  
  <div *ngIf="!loading() && flights().length === 0" class="no-flights">
    No flights found.
  </div>

  <div class="flights-grid">
    <div *ngFor="let flight of flights()" class="flight-card" [class]="flight.status.toLowerCase().replace(' ', '-')">
      <div class="flight-header">
        <span class="flight-number">{{ flight.flight_number }}</span>
        <span class="flight-status">{{ flight.status }}</span>
      </div>
      
      <div class="flight-details">
        <div class="route">
          <span class="airport">{{ flight.origin_code }}</span>
          <span class="arrow">✈️</span>
          <span class="airport">{{ flight.destination_code }}</span>
        </div>
        <div class="time">Duration: {{ flight.flight_duration_hours }}h</div>
      </div>

      <div class="flight-actions">
        <!-- ATC Actions -->
        <button 
          *ngIf="user()?.user_type === 'ATC' && flight.status === 'Scheduled'" 
          (click)="dispatchFlight(flight.flight_id)"
          class="btn-dispatch"
        >
          Dispatch
        </button>
        
        <button 
          *ngIf="user()?.user_type === 'ATC'" 
          (click)="trackFlight(flight.flight_id)"
          class="btn-track"
        >
          Track
        </button>

        <!-- Passenger Actions -->
        <button 
          *ngIf="user()?.user_type === 'Passenger' && flight.status === 'Boarding'" 
          (click)="boardFlight(flight.flight_id)"
          class="btn-board"
        >
          Confirm Boarding
        </button>
        
        <button 
          *ngIf="user()?.user_type === 'Passenger'" 
          (click)="trackFlight(flight.flight_id)"
          class="btn-track"
        >
          Track
        </button>
      </div>
    </div>
  </div>
</div>
