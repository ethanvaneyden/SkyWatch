<div class="login-container">
  <div class="login-card">
    <h2>✈️ SKYWATCH</h2>
    <p>Login to track your flights</p>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="credentials.email" 
          required 
          #email="ngModel"
          class="form-control"
          placeholder="Enter your email"
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="credentials.password" 
          required 
          #password="ngModel"
          class="form-control"
          placeholder="Enter your password"
        >
      </div>
      
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      
      <button type="submit" [disabled]="!loginForm.form.valid || loading" class="btn-login">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
    
    <div class="register-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>

    <div class="test-accounts">
      <p>Test Accounts (password: password123):</p>
      <code>atc&#64;skywatch.com</code> | <code>passenger&#64;skywatch.com</code>
    </div>
  </div>
</div>
