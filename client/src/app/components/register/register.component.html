<div class="register-container">
  <div class="register-card">
    <button (click)="toggleTheme()" class="btn-theme-register" [title]="'Switch to ' + (themeService.currentTheme() === 'light' ? 'Dark' : 'Light') + ' Mode'">
      {{ themeService.currentTheme() === 'light' ? '🌙' : '☀️' }}
    </button>
    <h2>JOIN SKYWATCH</h2>
    <p class="subtitle">Real-time flight tracking system</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">First Name</label>
          <input type="text" id="name" name="name" [(ngModel)]="userData.name" required class="form-control" placeholder="John">
        </div>
        <div class="form-group">
          <label for="surname">Last Name</label>
          <input type="text" id="surname" name="surname" [(ngModel)]="userData.surname" required class="form-control" placeholder="Doe">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="userData.email" required class="form-control" placeholder="john&#64;skywatch.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="userData.password" required class="form-control" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label>Account Role</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="user_type" value="Passenger" [(ngModel)]="userData.user_type"> Passenger
          </label>
          <label class="radio-label">
            <input type="radio" name="user_type" value="ATC" [(ngModel)]="userData.user_type"> ATC
          </label>
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" [disabled]="!registerForm.form.valid || loading" class="btn-register">
        {{ loading ? 'CREATING...' : 'GET STARTED' }}
      </button>
    </form>

    <div class="login-link">
      ALREADY REGISTERED? <a routerLink="/login">SIGN IN</a>
    </div>
  </div>
</div>
